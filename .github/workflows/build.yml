name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows OpenGL
            build_flags: ""
          - os: windows-latest
            name: Windows DirectX 12
            build_flags: "-d:useDirectX"
          - os: windows-latest
            name: Windows Vulkan
            build_flags: "-d:useVulkan"
          - os: windows-latest
            name: Windows CPU
            build_flags: "-d:useCpu"
          - os: ubuntu-latest
            name: Linux OpenGL
            build_flags: ""
          - os: ubuntu-latest
            name: Linux Emscripten
            emscripten: true
          - os: macos-latest
            name: macOS OpenGL
            build_flags: ""
          - os: macos-latest
            name: macOS Metal
            build_flags: "-d:useMetal4"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6

      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby sync silky/nimby.lock

      - name: Install Emscripten
        if: matrix.emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Install DirectX shader compiler
        if: matrix.build_flags == '-d:useDirectX'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'dxc'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1') { throw 'DXC archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $tools
          $compiler = Join-Path $tools 'bin/x64/dxc.exe'
          "SHADY_HLSL_COMPILER=$compiler" >> $env:GITHUB_ENV
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'DXC did not start' }

      - name: Install SPIR-V shader compiler
        if: matrix.build_flags == '-d:useVulkan'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'glslang.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'glslang'
          Invoke-WebRequest 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b') { throw 'glslang archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $tools
          $compiler = Join-Path $tools 'bin/glslang.exe'
          "SHADY_SPIRV_COMPILER=$compiler" >> $env:GITHUB_ENV
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'glslang did not start' }

      - name: Run unit tests
        if: ${{ !matrix.emscripten }}
        run: |
          nim r tests/test_textboxes.nim
          nim r ${{ matrix.build_flags }} tests/test_richtextboxes.nim
          nim r -d:silkyTesting -d:nimTypeNames tests/test_inputs.nim
          nim r -d:silkyTesting tests/test_buttons.nim
          nim r -d:silkyTesting tests/test_focus.nim
          nim r -d:silkyTesting tests/test_text_menus.nim
          nim r -d:silkyTesting tests/test_cursor_scroll.nim
          nim r -d:silkyTesting tests/test_input_hooks.nim
          nim r -d:silkyTesting tests/test_paste_hooks.nim
          nim r -d:silkyTesting tests/test_secure_inputs.nim
          nim r -d:silkyTesting tests/test_first_touch.nim
          nim r -d:silkyTesting tests/test_touch_scroll.nim
          nim r -d:silkyTesting tests/test_scroll_momentum.nim
          nim r -d:silkyTesting tests/test_scroll_indicators.nim
          nim r -d:silkyTesting tests/test_rendering.nim
          nim r -d:silkyTesting tests/test_subwindow.nim
          nim r tests/test_atlas_png.nim
          nim r tests/test_atlas_paths.nim
          nim r tests/test_retina_atlas.nim
          nim r tests/test_shader_codegen.nim
          nim r ${{ matrix.build_flags }} tests/test_density.nim
          nim r ${{ matrix.build_flags }} tests/test_decorations.nim
          nim r ${{ matrix.build_flags }} tests/test_rules.nim
          nim r ${{ matrix.build_flags }} tests/test_quotes.nim
          nim r ${{ matrix.build_flags }} tests/test_richimages.nim
          nim r ${{ matrix.build_flags }} tests/test_richscrolls.nim
          nim r ${{ matrix.build_flags }} tests/test_button_vertices.nim
          nim r -d:silkyTesting tests/test_layout.nim
          nim r -d:silkyTesting tests/test_layout_regressions.nim
          nim r ${{ matrix.build_flags }} tests/test_layout_clips.nim
          nim r ${{ matrix.build_flags }} tests/test_cpu_backend.nim

      - name: Compile examples
        if: ${{ !matrix.emscripten }}
        run: |
          nim c ${{ matrix.build_flags }} examples/basicwindow/basicwindow.nim
          nim c ${{ matrix.build_flags }} examples/calculator/calculator.nim
          nim c ${{ matrix.build_flags }} examples/gameplayer/gameplayer.nim
          nim c ${{ matrix.build_flags }} examples/menu/menu.nim
          nim c ${{ matrix.build_flags }} examples/panels/panels.nim
          nim c ${{ matrix.build_flags }} examples/patterns/patterns.nim
          nim c ${{ matrix.build_flags }} examples/the7gui/the7gui.nim
          nim c ${{ matrix.build_flags }} examples/todomvc/todomvc.nim
          nim c ${{ matrix.build_flags }} tests/manual_inputs.nim

      - name: Compile examples (Emscripten)
        if: matrix.emscripten
        run: |
          (cd examples/basicwindow && nim c -d:emscripten basicwindow.nim)
          (cd examples/layouts && nim c -d:emscripten layouts.nim)
          (cd examples/calculator && nim c -d:emscripten calculator.nim)
          (cd examples/gameplayer && nim c -d:emscripten gameplayer.nim)
          (cd examples/menu && nim c -d:emscripten menu.nim)
          (cd examples/panels && nim c -d:emscripten panels.nim)
          (cd examples/patterns && nim c -d:emscripten patterns.nim)
          (cd examples/the7gui && nim c -d:emscripten the7gui.nim)
          (cd examples/todomvc && nim c -d:emscripten todomvc.nim)

      - name: Run example tests
        if: ${{ !matrix.emscripten }}
        shell: bash
        run: |
          (cd examples/basicwindow && nim r tests/test.nim)
          (cd examples/layouts && nim r tests/test.nim)
          (cd examples/calculator && nim r tests/test.nim)
          (cd examples/gameplayer && nim r tests/test.nim)
          (cd examples/menu && nim r tests/test.nim)
          (cd examples/panels && nim r tests/test.nim)
          (cd examples/patterns && nim r tests/test.nim)
          (cd examples/the7gui && nim r tests/test.nim)
          (cd examples/todomvc && nim r tests/test.nim)

      - name: Run atlas tests
        if: ${{ !matrix.emscripten }}
        run: nim r tests/test_atlas_png.nim
